<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anh Lin Voice Pro - Full Features</title>
    <style>
        :root { --p: #00d2ff; --s: #3a7bd5; --bg: #0f172a; --c: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .card { background: var(--c); width: 100%; max-width: 450px; padding: 25px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .logo { width: 70px; height: 70px; background: linear-gradient(135deg, var(--p), var(--s)); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 30px; font-weight: bold; transform: rotate(-5deg); box-shadow: 0 10px 20px rgba(0,210,255,0.3); }
        .title { font-size: 24px; font-weight: 800; background: linear-gradient(to right, #00d2ff, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px; }
        .section { background: rgba(255,255,255,0.03); padding: 18px; border-radius: 18px; margin-bottom: 20px; text-align: left; border: 1px solid rgba(255,255,255,0.05); }
        .label { font-size: 11px; color: var(--p); font-weight: 700; text-transform: uppercase; margin-bottom: 12px; display: block; }
        input[type="text"], select, input[type="file"] { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 12px; }
        button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; color: white; font-size: 14px; }
        .btn-primary { background: linear-gradient(to right, var(--p), var(--s)); }
        .btn-rec { background: #ef4444; }
        .btn-stop { background: #f97316; animation: pulse 1.5s infinite; }
        .btn-success { background: #22c55e; }
        @keyframes pulse { 50% { opacity: 0.6; } }
        #status { font-size: 13px; color: #94a3b8; margin: 15px 0; text-align: center; font-style: italic; }
        audio { width: 100%; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">AL</div>
    <div class="title">ANH LIN AI VOICE</div>

    <div class="section">
        <span class="label">1. Huấn luyện giọng mẫu mới</span>
        <input type="text" id="voiceName" placeholder="Đặt tên giọng (Ví dụ: Giọng của Anh Lin)">
        <input type="file" id="sampleFile" accept="audio/*">
        <div class="btn-group">
            <button id="recSampleStart" class="btn-rec">🎤 GHI ÂM MẪU</button>
            <button id="recSampleStop" class="btn-stop" style="display:none">🛑 DỪNG GHI</button>
        </div>
        <button id="uploadSampleBtn" class="btn-primary" style="width: 100%;">HUẤN LUYỆN GIỌNG AI</button>
    </div>

    <div class="section">
        <span class="label">2. Đổi giọng AI</span>
        <select id="voiceList"><option>Đang tải danh sách giọng...</option></select>
        <input type="file" id="targetFile" accept="audio/*">
        <div class="btn-group">
            <button id="recTargetStart" class="btn-rec">🎤 GHI ÂM TRỰC TIẾP</button>
            <button id="recTargetStop" class="btn-stop" style="display:none">🛑 DỪNG GHI</button>
        </div>
        <button id="convertBtn" class="btn-primary" style="width: 100%;">BẮT ĐẦU CHUYỂN ĐỔI</button>
    </div>

    <div id="status">Sẵn sàng!</div>
    <audio id="audioPlayer" controls></audio>
    <button id="downloadBtn" class="btn-success" style="display:none; width: 100%; margin-top: 15px;">⬇️ TẢI GIỌNG ĐÃ ĐỔI VỀ MÁY</button>
</div>

<script>
    const API_KEY = "A02cf7278f913a0f143c834edc3111ef0a0b9e4929e501b168193475546e01dd";
    const statusTxt = document.getElementById('status');
    const voiceList = document.getElementById('voiceList');
    const player = document.getElementById('audioPlayer');
    const dlBtn = document.getElementById('downloadBtn');
    let mediaRecorder, audioChunks = [], sampleBlob, targetBlob;

    async function fetchVoices() {
        try {
            const res = await fetch('https://api.elevenlabs.io/v1/voices', { headers: { 'xi-api-key': API_KEY } });
            const data = await res.json();
            if (data.voices) {
                voiceList.innerHTML = data.voices.map(v => `<option value="${v.voice_id}">${v.name}</option>`).join('');
                statusTxt.innerText = "✅ Đã tải xong danh sách giọng!";
            }
        } catch (e) { statusTxt.innerText = "❌ Lỗi kết nối API!"; }
    }
    fetchVoices();

    async function startRecording(type) {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/mpeg' });
            if (type === 'sample') sampleBlob = blob; else targetBlob = blob;
            statusTxt.innerText = "✅ Ghi âm xong!";
        };
        mediaRecorder.start();
        statusTxt.innerText = "🔴 Đang ghi âm...";
    }

    document.getElementById('recSampleStart').onclick = () => { startRecording('sample'); document.getElementById('recSampleStart').style.display='none'; document.getElementById('recSampleStop').style.display='block'; };
    document.getElementById('recSampleStop').onclick = () => { mediaRecorder.stop(); document.getElementById('recSampleStart').style.display='block'; document.getElementById('recSampleStop').style.display='none'; };
    document.getElementById('recTargetStart').onclick = () => { startRecording('target'); document.getElementById('recTargetStart').style.display='none'; document.getElementById('recTargetStop').style.display='block'; };
    document.getElementById('recTargetStop').onclick = () => { mediaRecorder.stop(); document.getElementById('recTargetStart').style.display='block'; document.getElementById('recTargetStop').style.display='none'; };

    document.getElementById('uploadSampleBtn').onclick = async () => {
        const name = document.getElementById('voiceName').value;
        const file = document.getElementById('sampleFile').files[0] || sampleBlob;
        if (!name || !file) return alert("Thiếu tên hoặc file mẫu!");
        statusTxt.innerText = "⏳ Đang huấn luyện AI...";
        const fd = new FormData(); fd.append('name', name); fd.append('files', file);
        const res = await fetch('https://api.elevenlabs.io/v1/voices/add', { method: 'POST', headers: { 'xi-api-key': API_KEY }, body: fd });
        if (res.ok) { statusTxt.innerText = "🎉 Xong! Đang cập nhật..."; setTimeout(fetchVoices, 2000); }
    };

    document.getElementById('convertBtn').onclick = async () => {
        const file = document.getElementById('targetFile').files[0] || targetBlob;
        if (!file) return alert("Hãy chọn file hoặc ghi âm!");
        statusTxt.innerText = "⚡ Đang xử lý giọng nói...";
        dlBtn.style.display = 'none'; player.style.display = 'none';
        const fd = new FormData(); fd.append('audio', file); fd.append('model_id', 'eleven_multilingual_sts_v2');
        const res = await fetch(`https://api.elevenlabs.io/v1/speech-to-speech/${voiceList.value}`, { method: 'POST', headers: { 'xi-api-key': API_KEY }, body: fd });
        if (res.ok) {
            const b = await res.blob(); const u = URL.createObjectURL(b);
            player.src = u; player.style.display = 'block'; player.play();
            dlBtn.style.display = 'block'; dlBtn.onclick = () => { const a = document.createElement('a'); a.href = u; a.download = 'AnhLin_AI.mp3'; a.click(); };
            statusTxt.innerText = "🎉 Hoàn tất!";
        } else { statusTxt.innerText = "❌ Lỗi xử lý!"; }
    };
</script>
</body>
</html>
