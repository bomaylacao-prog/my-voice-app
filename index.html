<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anh Lin AI - Chuyên Gia Giọng Nói</title>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; min-height: 100vh; }
        .card { background: var(--card-bg); width: 100%; max-width: 450px; padding: 25px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 25px rgba(0,0,0,0.3); text-align: center; }
        
        /* LOGO CHUYÊN NGHIỆP */
        .logo-box { width: 60px; height: 60px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 15px; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 24px; font-weight: bold; color: white; transform: rotate(-5deg); box-shadow: 0 8px 15px rgba(0, 210, 255, 0.3); }
        .brand { font-size: 20px; font-weight: 800; background: linear-gradient(to right, #00d2ff, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px; }

        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 20px; text-align: left; }
        .section-title { font-size: 13px; font-weight: 600; color: var(--primary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        input, select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 14px; box-sizing: border-box; }
        button { border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-main { background: linear-gradient(to right, var(--primary), var(--secondary)); }
        .btn-main:active { transform: scale(0.98); }
        .btn-record { background: #ef4444; }
        .btn-stop { background: #f97316; animation: blink 1s infinite; }
        .btn-download { background: #22c55e; margin-top: 10px; display: none; }

        @keyframes blink { 50% { opacity: 0.7; } }
        #status { font-size: 13px; color: #94a3b8; margin: 10px 0; }
        audio { width: 100%; margin-top: 15px; border-radius: 10px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-box">AL</div>
    <div class="brand">ANH LIN VOICE AI</div>

    <div class="section">
        <div class="section-title">1. Huấn luyện giọng mẫu</div>
        <input type="file" id="sampleInput" accept="audio/*">
        <input type="text" id="voiceName" placeholder="Tên giọng (VD: Anh Lin)">
        <button class="btn-main" id="cloneBtn">TẠO GIỌNG AI</button>
    </div>

    <div class="section">
        <div class="section-title">2. Chuyển đổi giọng nói</div>
        <select id="voiceList"><option>Đang tải danh sách giọng...</option></select>
        
        <div style="display: flex; gap: 10px;">
            <button id="startRecord" class="btn-record">🎤 GHI ÂM</button>
            <button id="stopRecord" class="btn-stop" style="display:none">🛑 DỪNG</button>
        </div>
        <input type="file" id="audioInput" accept="audio/*">
        
        <button class="btn-main" id="convertBtn">BẮT ĐẦU CHUYỂN ĐỔI</button>
    </div>
