<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Changer - Anh Lin</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; }
        .card { background-color: #1e1e1e; padding: 25px; border-radius: 15px; border: 1px solid #333; max-width: 400px; margin: auto; }
        select, input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; }
        button { background-color: #007bff; color: white; font-weight: bold; cursor: pointer; }
        #status { margin-top: 10px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎙️ Đổi Giọng AI</h2>
        <p style="font-size: 12px; color: #888;">Gói: 10,000 credit ElevenLabs</p>
        <label style="display:block; text-align:left;">1. Chọn giọng AI:</label>
        <select id="voiceList"><option>Đang tải...</option></select>
        <label style="display:block; text-align:left; margin-top:10px;">2. Chọn file âm thanh:</label>
        <input type="file" id="audioInput" accept="audio/*">
        <button id="convertBtn">BẮT ĐẦU ĐỔI GIỌNG</button>
        <div id="status"></div>
        <audio id="audioPlayer" controls style="display:none; margin-top:20px; width:100%"></audio>
    </div>
    <script>
        const API_KEY = "sk_9dcfa023b4ba75ae26c8c5158d5f36474ca82c68c13035e2";
        fetch('https://api.elevenlabs.io/v1/voices', { headers: {'xi-api-key': API_KEY} })
            .then(res => res.json()).then(data => {
                document.getElementById('voiceList').innerHTML = data.voices.map(v => `<option value="${v.voice_id}">${v.name}</option>`).join('');
            });
        document.getElementById('convertBtn').onclick = async () => {
            const file = document.getElementById('audioInput').files[0];
            if (!file) return alert("Chọn file đã!");
            const btn = document.getElementById('convertBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerText = "⚡ Đang xử lý...";
            const formData = new FormData();
            formData.append('audio', file);
            formData.append('model_id', 'eleven_multilingual_sts_v2');
            try {
                const res = await fetch(`https://api.elevenlabs.io/v1/speech-to-speech/${document.getElementById('voiceList').value}`, {
                    method: 'POST', headers: {'xi-api-key': API_KEY}, body: formData
                });
                if (res.ok) {
                    const url = URL.createObjectURL(await res.blob());
                    const player = document.getElementById('audioPlayer');
                    player.src = url; player.style.display = "block";
                    status.innerText = "✅ Xong! Nghe thử bên dưới.";
                } else { status.innerText = "❌ Lỗi rồi!"; }
            } catch (e) { status.innerText = "❌ Lỗi kết nối!"; }
            btn.disabled = false;
        };
    </script>
</body>
</html>
